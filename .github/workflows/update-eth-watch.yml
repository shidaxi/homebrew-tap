name: Update eth-watch formula

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new release and update formula
        run: |
          set -euo pipefail

          REPO="shidaxi/eth-watch"
          FORMULA="Formula/eth-watch.rb"

          # Get latest release info
          RELEASE=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest")
          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')
          BARE_VERSION="${VERSION#v}"

          # Check current version in formula
          if [ -f "$FORMULA" ]; then
            CURRENT=$(grep -oP '(?<=version ")[^"]+' "$FORMULA" || echo "")
            if [ "$CURRENT" = "$BARE_VERSION" ]; then
              echo "Already up to date: ${BARE_VERSION}"
              exit 0
            fi
          fi

          echo "Updating to ${BARE_VERSION}"

          # Download tarballs and compute sha256
          declare -A SHAS
          for pair in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            OS="${pair%-*}"
            ARCH="${pair#*-}"
            URL="https://github.com/${REPO}/releases/download/${VERSION}/eth-watch_${BARE_VERSION}_${OS}_${ARCH}.tar.gz"
            SHA=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
            SHAS["${OS}_${ARCH}"]="$SHA"
            echo "${OS}_${ARCH}: ${SHA}"
          done

          # Generate formula
          cat > "$FORMULA" <<RUBY
          class EthWatch < Formula
            desc "Terminal dashboard for monitoring Ethereum RPC nodes"
            homepage "https://github.com/${REPO}"
            version "${BARE_VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/${VERSION}/eth-watch_${BARE_VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHAS[darwin_arm64]}"
              else
                url "https://github.com/${REPO}/releases/download/${VERSION}/eth-watch_${BARE_VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHAS[darwin_amd64]}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/${VERSION}/eth-watch_${BARE_VERSION}_linux_arm64.tar.gz"
                sha256 "${SHAS[linux_arm64]}"
              else
                url "https://github.com/${REPO}/releases/download/${VERSION}/eth-watch_${BARE_VERSION}_linux_amd64.tar.gz"
                sha256 "${SHAS[linux_amd64]}"
              end
            end

            def install
              bin.install "eth-watch"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/eth-watch --version 2>&1", 1)
            end
          end
          RUBY

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' "$FORMULA"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          VERSION=$(grep -oP '(?<=version ")[^"]+' Formula/eth-watch.rb)
          git commit -m "Update eth-watch to ${VERSION}"
          git push
